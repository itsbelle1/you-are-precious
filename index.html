
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Are Precious</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <p class="eyebrow">A LITTLE REMINDER FOR YOU</p>

    <h1>You Are Precious. 🤍</h1>

    <h2>You are seen. You are valued. You are loved.</h2>

    <div class="verse-card">
      <p class="verse">
        "You are precious to me. You are honored, and I love you."
      </p>
      <p class="reference">Isaiah 43:4 (NLT)</p>
    </div>

    <p class="message">
      Maybe no one has told you this lately, but your life matters.
      You are not forgotten. God sees you, knows you, and loves you.
    </p>

    <button onclick="showMessage()">Read a message for you</button>

    <p id="extra-message"></p>
  </main>

  <script src="script.js"></script>

</html>
